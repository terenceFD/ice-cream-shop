<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#092a53" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cold Stone" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Fonts are served by the site. Keep them behind the hero photo so the first picture is not delayed. -->
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low" />
    <link rel="preload" href="/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low" />
    <!-- The home page's first slider photo. Without this the browser only finds it once the app's code has run. -->
    <link rel="preload" as="image" href="/ice-images/ice-9.jpg" imagesrcset="/thumbs/160/ice-images/ice-9.webp 160w, /thumbs/480/ice-images/ice-9.webp 480w, /thumbs/800/ice-images/ice-9.webp 800w, /ice-images/ice-9.jpg 1200w" imagesizes="(min-width: 1024px) 600px, 92vw" fetchpriority="high" />
    <!-- The server replaces everything between these markers with page-specific tags. -->
    <!--seo-->
    <title>Cold Stone Creamery Cameroon | Ice Cream in Douala & Yaoundé</title>
    <meta
      name="description"
      content="Cold Stone Creamery Cameroon: ice cream mixed to order, signature creations, cakes and shakes. Order online for pickup or delivery in Douala and Yaoundé."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cold Stone Creamery Cameroon" />
    <meta property="og:title" content="Cold Stone Creamery Cameroon | Ice Cream in Douala & Yaoundé" />
    <meta
      property="og:description"
      content="Cold Stone Creamery Cameroon: ice cream mixed to order, signature creations, cakes and shakes. Order online for pickup or delivery in Douala and Yaoundé."
    />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--/seo-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
